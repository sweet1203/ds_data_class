<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>데이터 과학 수업 자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16202c;--muted:#5b6776;--paper:#f3efe7;--line:#e3ddd2;--navy:#0f2742;--amber:#f2a516}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
  header{background:var(--navy);color:#fff;padding:20px 16px 16px}
  .wrap{max-width:1100px;margin:0 auto}
  header h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.9rem;margin:0}
  header p{margin:6px 0 0;color:#c8d6e8;font-size:.92rem}
  .top{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .top a{color:var(--navy);background:var(--amber);border-radius:10px;padding:6px 12px;text-decoration:none;font-weight:700;font-size:.92rem}
  main{padding:16px 16px 60px}
  .tg{font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin:4px 0 0}
  .unit{margin:24px 0 8px;display:flex;align-items:center;gap:10px}
  .unit h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:1.4rem;margin:0;color:var(--k)}
  .unit .cnt{color:var(--muted);font-size:.85rem}
  .les{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(15,39,66,.06);padding:10px 12px;margin-bottom:7px;border-left:6px solid var(--k)}
  .les.todo{opacity:.5;border-left-style:dashed}
  .no{font-family:"Black Han Sans",sans-serif;font-size:1.2rem;color:var(--k)}
  .les h3{margin:0;font-size:1rem}
  .les small{color:var(--muted);font-size:.8rem}
  .st{display:inline-block;font-size:.72rem;border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
  .st.ready{background:#e3f4ec;color:#17694f}.st.draft{background:#fff4d6;color:#8a5a00}.st.todo{background:#eef0f3;color:#5b6776}
  .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .act a,.act button{font:inherit;font-size:.82rem;border:1.5px solid var(--k);background:#fff;color:var(--ink);border-radius:9px;padding:3px 9px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .act a:hover,.act button:hover{background:color-mix(in srgb,var(--k) 12%,white)}
  @media (max-width:640px){.les{grid-template-columns:48px 1fr}.act{grid-column:1/-1;justify-content:flex-start}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>데이터 과학 수업 자료</h1>
  <p>선생님용 목록입니다. 「열기」는 미리보기(전송 안 함)로 열리고, 📋은 학생에게 줄 주소를 복사합니다.</p>
  <div class="top"><a href="progress/">📈 진도 현황</a><span id="assess"></span></div>
  <label class="tg"><input type="checkbox" id="showTodo"> 아직 만들지 않은 차시도 보기</label>
</div></header>
<main><div class="wrap" id="list"></div></main>
<div class="toast" id="toast"></div>
<script>
const UNITS=[{"name": "Ⅰ. 데이터 과학의 이해", "color": "#2f6fd0", "lessons": [{"no": "01", "id": "u1-data-science", "title": "데이터 과학의 등장과 활용", "pages": "12~17", "form": "data-u1-data-science", "status": "ready"}, {"no": "02", "id": "u1-decision", "title": "데이터 기반 의사 결정", "pages": "18~21", "form": "data-u1-decision", "status": "ready"}, {"no": "03", "id": "u1-data-types", "title": "데이터의 형태: 정형·비정형 데이터", "pages": "22~25", "form": "data-u1-data-types", "status": "ready"}, {"no": "04", "id": "u1-attributes", "title": "데이터 속성과 속성 간의 관계 · 정리", "pages": "26~31", "form": "data-u1-attributes", "status": "ready"}, {"no": "05", "id": "u1-database", "title": "데이터셋과 데이터베이스", "pages": "32~39", "form": "data-u1-database", "status": "ready"}, {"no": "06", "id": "u1-relational", "title": "관계형 데이터베이스와 데이터 통합", "pages": "40~47", "form": "data-u1-relational", "status": "ready"}, {"no": "07", "id": "u1-future", "title": "데이터와 미래 사회 · 정리", "pages": "48~53", "form": "data-u1-future", "status": "ready"}, {"no": "08", "id": "u1-review", "title": "협력적 창의·융합 활동 · Ⅰ단원 정리", "pages": "54~57", "form": "data-u1-review", "status": "ready"}]}, {"name": "Ⅱ. 데이터 준비와 분석", "color": "#1f9d74", "lessons": [{"no": "09", "id": "u2-collect", "title": "데이터 수집과 편향", "pages": "58~66", "form": "data-u2-collect", "status": "ready"}, {"no": "10", "id": "u2-summary", "title": "요약 통계량으로 데이터 파악하기", "pages": "67~69", "form": "data-u2-summary", "status": "ready"}, {"no": "11", "id": "u2-clean", "title": "결측치와 이상치 처리", "pages": "70~73", "form": "data-u2-clean", "status": "ready"}, {"no": "12", "id": "u2-integrate", "title": "데이터 통합과 스케일링", "pages": "74~77", "form": "data-u2-integrate", "status": "ready"}, {"no": "13", "id": "u2-preprocess-lab", "title": "전처리 실습과 시각화 · 정리", "pages": "78~85", "form": "data-u2-preprocess-lab", "status": "ready"}, {"no": "14", "id": "u2-descriptive", "title": "기술 통계: 대푯값과 산포도", "pages": "86~95", "form": "data-u2-descriptive", "status": "ready"}, {"no": "15", "id": "u2-correlation", "title": "상관분석", "pages": "96~101", "form": "data-u2-correlation", "status": "ready"}, {"no": "16", "id": "u2-practice-1", "title": "데이터 분석의 실제 ① 데이터 준비", "pages": "102~107", "form": "data-u2-practice-1", "status": "ready"}, {"no": "17", "id": "u2-practice-2", "title": "데이터 분석의 실제 ② 분석과 해석 · 정리", "pages": "108~115", "form": "data-u2-practice-2", "status": "ready"}, {"no": "18", "id": "u2-review", "title": "협력적 창의·융합 활동 · Ⅱ단원 정리", "pages": "116~119", "form": "data-u2-review", "status": "ready"}]}, {"name": "Ⅲ. 데이터 모델링과 평가", "color": "#9b4fc4", "lessons": [{"no": "19", "id": "u3-model", "title": "데이터 모델과 분석 도구", "pages": "120~129", "form": "data-u3-model", "status": "todo"}, {"no": "20", "id": "u3-regression", "title": "회귀분석: 통계적 모델과 기계학습 모델", "pages": "130~133", "form": "data-u3-regression", "status": "todo"}, {"no": "21", "id": "u3-regression-stat", "title": "통계적 회귀 모델 실습", "pages": "134~137", "form": "data-u3-regression-stat", "status": "todo"}, {"no": "22", "id": "u3-regression-ml", "title": "기계학습 회귀 모델 실습 · 정리", "pages": "138~141", "form": "data-u3-regression-ml", "status": "todo"}, {"no": "23", "id": "u3-clustering", "title": "군집분석의 개념과 목적", "pages": "142~147", "form": "data-u3-clustering", "status": "todo"}, {"no": "24", "id": "u3-clustering-lab", "title": "k-평균 군집분석 실습", "pages": "148~153", "form": "data-u3-clustering-lab", "status": "todo"}, {"no": "25", "id": "u3-association", "title": "연관분석의 개념과 지표", "pages": "154~160", "form": "data-u3-association", "status": "todo"}, {"no": "26", "id": "u3-association-lab", "title": "연관분석 실습 · 정리", "pages": "161~167", "form": "data-u3-association-lab", "status": "todo"}, {"no": "27", "id": "u3-review", "title": "협력적 창의·융합 활동 · Ⅲ단원 정리", "pages": "168~171", "form": "data-u3-review", "status": "todo"}]}, {"name": "Ⅳ. 데이터 과학 프로젝트", "color": "#e0702b", "lessons": [{"no": "28", "id": "u4-problem-solving", "title": "데이터 과학으로 문제 해결하기", "pages": "172~181", "form": "data-u4-problem-solving", "status": "todo"}, {"no": "29", "id": "u4-stress-1", "title": "스트레스 지수 예측 ① 데이터 수집과 전처리", "pages": "182~189", "form": "data-u4-stress-1", "status": "todo"}, {"no": "30", "id": "u4-stress-2", "title": "스트레스 지수 예측 ② 분석과 모델링 · 정리", "pages": "190~193", "form": "data-u4-stress-2", "status": "todo"}, {"no": "31", "id": "u4-team-project", "title": "협력적 프로젝트", "pages": "194~195", "form": "data-u4-team-project", "status": "todo"}, {"no": "32", "id": "u4-movie-1", "title": "【선택】 영화 관객 수 예측 ① 데이터 준비와 시각화", "pages": "196~204", "form": "data-u4-movie-1", "status": "todo"}, {"no": "33", "id": "u4-movie-2", "title": "【선택】 영화 관객 수 예측 ② 회귀 모델 · 정리", "pages": "205~209", "form": "data-u4-movie-2", "status": "todo"}, {"no": "34", "id": "u4-country-1", "title": "【선택】 국가 군집 분석 ① 데이터 탐색과 시각화", "pages": "210~219", "form": "data-u4-country-1", "status": "todo"}, {"no": "35", "id": "u4-country-2", "title": "【선택】 국가 군집 분석 ② 군집화와 해석 · 정리", "pages": "220~225", "form": "data-u4-country-2", "status": "todo"}, {"no": "36", "id": "u4-review", "title": "Ⅳ단원 정리", "pages": "226~227", "form": "data-u4-review", "status": "todo"}]}], SITE='https://dsdataclass.vercel.app/', ASSESS=[];
document.getElementById('assess').innerHTML=ASSESS.map(a=>`<a href="../${a.path}" target="_blank" rel="noopener" title="${a.note||''}">📋 수행평가 · ${a.title}</a><button data-u="${SITE}${a.path}" style="margin-left:4px">📋 주소</button>`).join(' ');
const ST={ready:'공개',draft:'만드는 중',todo:'아직 없음'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
  const all=document.getElementById('showTodo').checked;
  document.getElementById('list').innerHTML=UNITS.map(u=>{
    const L=u.lessons.filter(l=>all||l.status!=='todo');
    if(!L.length) return '';
    return `<div class="unit" style="--k:${u.color}"><h2>${esc(u.name)}</h2><span class="cnt">${u.lessons.filter(l=>l.status==='ready').length} / ${u.lessons.length} 공개</span></div>`+
      L.map(l=>{const url=SITE+l.id+'/', has=l.status!=='todo';
        return `<div class="les ${l.status}" style="--k:${u.color}"><div class="no">${esc(l.no)}</div>
        <div><h3>${esc(l.title)}<span class="st ${l.status}">${ST[l.status]}</span></h3><small>${esc(l.pages)}쪽 · ${esc(l.id)}</small></div>
        <div class="act">${has?`<a href="../${l.id}/?preview" target="_blank" rel="noopener">열기</a><button data-u="${esc(url)}">📋 학생 주소</button>`:''}${has&&l.form?`<a href="../forms/${esc(l.form)}.html?preview" target="_blank" rel="noopener">질문폼</a>`:''}</div></div>`;}).join('');
  }).join('');
}
document.getElementById('showTodo').onchange=draw; draw();
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-u]'); if(!b) return;
  try{await navigator.clipboard.writeText(b.dataset.u); toast('학생 주소를 복사했어요');}catch(x){prompt('주소를 복사하세요',b.dataset.u);}});
function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1500);}
</script>
</body>
</html>
